      opacity: 1;
      transition: opacity 0.5s ease-in-out;
      position: relative;

      content: '';
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      height: 192px;
      background: url('icons/Icon-192.png') no-repeat center / contain;
      opacity: 0;
      animation: pulse 1.5s infinite;

      pointer-events: none;
    }
    #loading.loaded::before {
      animation-iteration-count: 1;
    }
