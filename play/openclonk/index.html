<script>/* Gamidio: no requests to third-party servers from this game */(function(){
var dead=new URL('gamidio-offline-blocked',location.href).href;
var foreign=function(u){try{return new URL(u,location.href).origin!==location.origin}catch(e){return false}};
var f=window.fetch;if(f){window.fetch=function(i,o){var u=typeof i==='string'?i:(i&&i.url);if(u&&foreign(u)){return f.call(window,dead,o&&{method:'GET'})}return f.apply(window,arguments)}}
var op=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){var a=[].slice.call(arguments);if(u&&foreign(u)){a[0]='GET';a[1]=dead}return op.apply(this,a)};
var W=window.WebSocket;if(W){window.WebSocket=function(u,p){if(foreign(String(u).replace(/^ws/,'http')))throw new DOMException('blocked by Gamidio','SecurityError');return new W(u,p)};window.WebSocket.prototype=W.prototype}
})();</script>
<script>/* Gamidio: keyboard focus on click, game keys do not scroll the page around the game */(function(){var f=function(){window.focus()};addEventListener('pointerdown',f,true);addEventListener('mousedown',f,true);addEventListener('touchstart',f,{capture:true,passive:true});addEventListener('keydown',function(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','PageUp','PageDown','Home','End'].indexOf(e.key)>=0&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))e.preventDefault()},true)})()</script>
<script>/* Gamidio: openclonk.data is stored in 4 parts and joined while loading */(function(){
var NAME="openclonk.data",N=4,SIZE=94016423,F=window.fetch.bind(window);
window.fetch=function(u,o){var s=typeof u==='string'?u:(u&&u.url)||'';var p=s.split('?')[0];if(p.split('/').pop()!==NAME)return F(u,o);
var i=0,cur=null;var stream=new ReadableStream({pull:function(c){function next(){if(cur)return cur.read().then(function(r){if(r.done){cur=null;return next()}c.enqueue(r.value)});
if(i>=N){c.close();return}return F(p+'.'+(i++)).then(function(r){if(!r.ok)throw new Error(NAME+' part '+(i-1)+': '+r.status);cur=r.body.getReader();return next()})}return next()}});
return Promise.resolve(new Response(stream,{status:200,headers:{'Content-Type':'application/octet-stream','Content-Length':String(SIZE)}}))};})();</script>

<body>
<div id="start">
  <h1>OpenClonk</h1>
  <p id="status">Loading&hellip;</p>
  <div id="bar"><div id="fill"></div></div>
  <p>The first start downloads about 100 MB. Your players and progress are saved in this browser.</p>

</div>
<div id="rotate">Turn your phone sideways to play.</div>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
(function () {
  var HOME = '/home/web_user/.clonk', CONFIG = HOME + '/openclonk/config';
  var status = document.getElementById('status'), fill = document.getElementById('fill');
  // The game reads its window size from the config, and it keeps whatever else the player changed.
  function writeConfig() {
    var w = Math.max(640, innerWidth), h = Math.max(360, innerHeight), text = '';
    FS.mkdirTree(HOME + '/openclonk');
    try { text = FS.readFile(CONFIG, {encoding: 'utf8'}); } catch (e) {}
    var size = {ResolutionX: w, ResolutionY: h, WindowX: w, WindowY: h, Windowed: 1, MultiSampling: 0};
    if (!/^\[Graphics\]/m.test(text)) text += '\n[Graphics]\n';
    Object.keys(size).forEach(function (key) {
      var line = key + '=' + size[key], re = new RegExp('^' + key + '=.*$', 'm');
      text = re.test(text) ? text.replace(re, line) : text.replace(/^\[Graphics\]$/m, '[Graphics]\n' + line);
    });
    // A player created just before leaving: without this the next start would have nobody selected.
    var players = FS.readdir(HOME + '/openclonk').filter(function (name) { return /\.ocp$/.test(name); });
    if (players.length && !/^Participants="[^"]/m.test(text)) {
      var who = 'Participants="' + players.join(';') + '"';
      if (/^Participants=/m.test(text)) text = text.replace(/^Participants=.*$/m, who);
      else text = /^\[General\]$/m.test(text) ? text.replace(/^\[General\]$/m, '[General]\n' + who) : '[General]\n' + who + '\n' + text;
    }
    FS.writeFile(CONFIG, text);
  }
  var saving = false;
  function save() {
    if (saving || !window.FS) return;
    saving = true;
    if (window._gamidio_save_config) window._gamidio_save_config();
    FS.syncfs(false, function () { saving = false; });
  }
  window.Module = {
    canvas: document.getElementById('canvas'),
    preRun: [function () {
      FS.mkdirTree(HOME);
      FS.mount(IDBFS, {}, HOME);
      addRunDependency('saves');
      FS.syncfs(true, function () { writeConfig(); removeRunDependency('saves'); });
    }],
    setStatus: function (text) {
      var m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text);
      if (m) {
        status.textContent = 'Downloading ' + Math.round(m[1] / 1e6) + ' of ' + Math.round(m[2] / 1e6) + ' MB';
        fill.style.width = (m[1] / m[2] * 100) + '%';
      } else if (text) status.textContent = 'Starting the game…';
    },
    onRuntimeInitialized: function () {
      document.getElementById('start').remove();
      document.getElementById('canvas').focus();
      setInterval(save, 20000);
      addEventListener('pagehide', save);
      document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    }
  };
})();
</script>
